name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Backend Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: SprintEra
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sprintera123
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: SprintEra
      DB_USER: postgres
      DB_PASSWORD: sprintera123
      JWT_SECRET: test_ci_super_secret_jwt_key_12345

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Database Migrations
        run: npm run migrate

      - name: Run Jest Tests
        run: npm test

      - name: Run Coverage Report
        run: npm run test:coverage
